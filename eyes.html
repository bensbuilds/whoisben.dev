<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ben — eyes</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1a1e23;
        --muted: #a7b0b8;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: auto;
      }

      body {
        margin: 0;
        min-height: 320vh;
        background: var(--bg);
        color: var(--muted);
        font-family: Inter, system-ui, sans-serif;
      }

      .hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 1.4rem;
        margin: 0;
        text-align: center;
        font-size: 0.92rem;
        letter-spacing: 0.01em;
        pointer-events: none;
      }

      .stage {
        position: fixed;
        left: 50%;
        top: 46%;
        width: min(78vw, 520px);
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
      }

      .stage img {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 18px;
        object-fit: cover;
      }

      .eye {
        position: absolute;
        border-radius: 50%;
        background-repeat: no-repeat;
        pointer-events: none;
        -webkit-mask-image: radial-gradient(circle, #000 46%, transparent 72%);
        mask-image: radial-gradient(circle, #000 46%, transparent 72%);
      }
    </style>
  </head>
  <body>
    <figure class="stage">
      <img src="portrait.jpg" alt="Portrait of Benjamin Gregg" width="400" height="400" />
      <span class="eye" data-x="157" data-y="148"></span>
      <span class="eye" data-x="218" data-y="147"></span>
    </figure>
    <p class="hint">Move the cursor. Scroll the page.</p>
    <script>
      const stage = document.querySelector(".stage");
      const img = stage.querySelector("img");
      const eyes = [...stage.querySelectorAll(".eye")];
      const iris = 22;
      const maxShift = 4.6;
      const gaze = { x: 0, y: 0 };
      const target = { x: 0, y: 0 };
      let pointer = null;

      function place(shiftX, shiftY) {
        const width = stage.clientWidth;
        const height = stage.clientHeight;
        const natural = img.naturalWidth || 400;
        const scale = width / natural;
        const size = iris * scale;
        eyes.forEach((eye) => {
          const px = Number(eye.dataset.x);
          const py = Number(eye.dataset.y);
          eye.style.width = size + "px";
          eye.style.height = size + "px";
          eye.style.left = px * scale - size / 2 + "px";
          eye.style.top = py * scale - size / 2 + "px";
          eye.style.backgroundImage = 'url("portrait.jpg")';
          eye.style.backgroundSize = width + "px " + height + "px";
          eye.style.backgroundPosition =
            size / 2 - px * scale + shiftX * scale + "px " +
            (size / 2 - py * scale + shiftY * scale) + "px";
        });
      }

      function aim(clientX, clientY) {
        const rect = stage.getBoundingClientRect();
        const originX = rect.left + rect.width * 0.47;
        const originY = rect.top + rect.height * 0.37;
        const dx = (clientX - originX) / (rect.width * 0.55);
        const dy = (clientY - originY) / (rect.height * 0.55);
        const reach = Math.hypot(dx, dy) || 1;
        const limited = Math.min(reach, 1) / reach;
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        const scroll = maxScroll > 0 ? window.scrollY / maxScroll : 0.5;
        let x = dx * limited;
        let y = dy * limited * 0.7 + (scroll - 0.5) * 1.15;
        const length = Math.hypot(x, y) || 1;
        const clamp = Math.min(length, 1) / length;
        target.x = x * clamp * maxShift;
        target.y = y * clamp * maxShift;
      }

      window.addEventListener("mousemove", (event) => {
        pointer = { x: event.clientX, y: event.clientY };
        aim(pointer.x, pointer.y);
      });

      window.addEventListener("scroll", () => {
        if (pointer) {
          aim(pointer.x, pointer.y);
          return;
        }
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        const scroll = maxScroll > 0 ? window.scrollY / maxScroll : 0.5;
        target.x = 0;
        target.y = (scroll - 0.5) * 2 * maxShift;
      }, { passive: true });

      window.addEventListener("resize", () => place(gaze.x, gaze.y));

      function tick() {
        gaze.x += (target.x - gaze.x) * 0.18;
        gaze.y += (target.y - gaze.y) * 0.18;
        place(gaze.x, gaze.y);
        requestAnimationFrame(tick);
      }

      img.addEventListener("load", () => {
        place(0, 0);
        tick();
      });

      if (img.complete) {
        place(0, 0);
        tick();
      }
    </script>
  </body>
</html>
